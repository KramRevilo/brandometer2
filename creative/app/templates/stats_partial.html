{% from 'stats_macros.html' import count_content, last_content, status_content %}
{% for item in stat_array %}
<div id="count-{{ item.id }}" hx-swap-oob="true">{{ count_content(item) }}</div>
<div id="last-{{ item.id }}" hx-swap-oob="true">{{ last_content(item) }}</div>
<div id="status-{{ item.id }}" hx-swap-oob="true">{{ status_content(item) }}</div>
{% endfor %}
